# Engineering Department Coordination
# CLAWD (lead) + SENTINEL
# Handles architecture, implementation, deployment, QA, and infrastructure.

name: Engineering
lead: clawd
members: [sentinel]

coordination:
  shared_vault: true
  vault_path: "shared/engineering/"

  roles:
    clawd:
      focus: "Architecture decisions, full-stack implementation, code review, deployment"
      authority: "Merge PRs, approve architecture changes, assign dev tasks, deploy decisions"
    sentinel:
      focus: "QA, monitoring, regression testing, bug triage, security scanning"
      authority: "Block merges on quality issues, create bug reports, approve fixes"

  communication:
    internal: "Shared vault -- SENTINEL creates review/bug reports, CLAWD reads and acts"
    external: "CLAWD reports to JARVIS on development progress and blockers"

  workflow:
    pr_flow:
      1: "CLAWD creates PR"
      2: "SENTINEL reviews code"
      3: "SENTINEL approves or requests changes"
      4: "CLAWD addresses feedback"
      5: "SENTINEL re-reviews and approves"
      6: "CLAWD merges"
    bug_flow:
      1: "SENTINEL detects or triages bug"
      2: "SENTINEL creates bug report with reproduction steps"
      3: "CLAWD implements fix"
      4: "SENTINEL verifies fix"

  cross_department:
    - department: creative
      agent: pixel
      interaction: "Receive design specs for implementation"
    - department: research
      agent: atlas
      interaction: "Receive technical research and competitive analysis"

  escalation:
    chain: [clawd, jarvis, owner]
    triggers:
      - "Service downtime exceeding 5 minutes"
      - "Security vulnerability discovered"
      - "Breaking change affecting other departments"
      - "Architecture decision with long-term implications"

  task_routing:
    incoming_tags: [code, build, deploy, test, qa, infra, bug, security]
    default_assignee: clawd
    auto_delegate:
      - tags: [qa, test, monitoring, uptime, health, security-scan] -> sentinel
      - tags: [code, build, feature, fix, deploy, infra] -> clawd

  quality:
    review_required: true
    reviewer: sentinel
    standards:
      - "All PRs must have tests"
      - "CI must pass before merge"
      - "No secrets in code"
      - "Breaking changes documented"
      - "Coding standards from memory/coding-standards.md enforced"
