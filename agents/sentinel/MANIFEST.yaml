agent:
  id: "sentinel"
  name: "SENTINEL"
  tier: 2
  role: "QA & Monitor"
  department: "engineering"
  reports_to: clawd

models:
  primary: "gpt-5.4"
  fallback: "google-gemini-cli/gemini-2.5-flash"
  thinking: "high"

skills:
  custom: []

loop:
  enabled: true
  interval: "10m"
  max_step_timeout: "2m"
  on_blocked: log_and_skip
  on_failure: log_skip_continue
  retry_blocked_after: 3
  reads: [TASKS.md, CONTEXT.md, HEARTBEAT.md, INBOX.md]
  writes: [TASKS.md, HEARTBEAT.md, CONTEXT.md]
  escalation: clawd
  cycle_log: true

evolve:
  enabled: true
  schedule: "0 0 * * 0"
  pressure_prompt_count: 8
  interaction_question_count: 12
  total_questions: 20
